<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Word to Art</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,serif;background:#f5f2ec;color:#1a1a1a;display:flex;min-height:100vh;}
#sidebar{width:250px;min-width:250px;background:#eeeae1;border-right:1px solid #d8d3c8;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden;}
#sidebar-header{padding:20px 16px 14px;border-bottom:1px solid #d8d3c8;flex-shrink:0;}
#sidebar-header .logo{font-size:1.3rem;color:#1a3bbf;letter-spacing:.04em;}
#sidebar-header p{font-size:11px;color:#888;font-family:sans-serif;margin-top:4px;}
#map-section{padding:14px 12px;flex-shrink:0;}
#map-section h3{font-size:10px;color:#aaa;font-family:sans-serif;font-weight:400;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
#world-map{width:100%;cursor:pointer;}
#world-map path{fill:#d8d3c8;stroke:#c4bfb4;stroke-width:.4;transition:fill .15s;}
#world-map path:hover{fill:#b8c8f0;}
#world-map path.selected{fill:#1a3bbf;}
#hover-name{font-size:12px;font-family:sans-serif;color:#999;min-height:18px;margin-top:8px;padding:0 2px;}
#hover-name.has-filter{color:#1a3bbf;font-weight:500;}
#clear-btn{display:none;width:100%;margin-top:10px;padding:7px;background:none;border:1px solid #c4bfb4;border-radius:6px;color:#888;font-size:12px;font-family:sans-serif;cursor:pointer;transition:all .15s;}
#clear-btn:hover{border-color:#1a3bbf;color:#1a3bbf;}
#clear-btn.visible{display:block;}
#collections-section{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid #d8d3c8;padding:14px 12px 12px;}
#collections-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
#collections-header h3{font-size:10px;color:#aaa;font-family:sans-serif;font-weight:400;letter-spacing:.08em;text-transform:uppercase;}
#new-folder-btn{background:none;border:none;color:#1a3bbf;font-size:18px;cursor:pointer;line-height:1;padding:0 2px;opacity:.7;transition:opacity .15s;}
#new-folder-btn:hover{opacity:1;}
#collections-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.collection-empty{font-size:11px;color:#bbb;font-family:sans-serif;text-align:center;padding:16px 0;line-height:1.7;}
.folder{border-radius:7px;overflow:hidden;border:1px solid #d8d3c8;background:#fff;}
.folder-header{display:flex;align-items:center;gap:6px;padding:7px 8px;cursor:pointer;user-select:none;transition:background .12s;}
.folder-header:hover{background:#f5f2ec;}
.folder-chevron{font-size:9px;color:#bbb;transition:transform .18s;flex-shrink:0;}
.folder.open .folder-chevron{transform:rotate(90deg);}
.folder-icon{font-size:13px;flex-shrink:0;}
.folder-name{flex:1;font-size:12px;font-family:sans-serif;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.folder-count{font-size:10px;color:#bbb;font-family:sans-serif;flex-shrink:0;}
.folder-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s;flex-shrink:0;}
.folder-header:hover .folder-actions{opacity:1;}
.folder-action-btn{background:none;border:none;cursor:pointer;font-size:11px;color:#bbb;padding:1px 3px;border-radius:3px;transition:color .12s;}
.folder-action-btn:hover{color:#c0392b;}
.folder-contents{display:none;padding:6px 8px 8px;border-top:1px solid #ede9e0;background:#faf8f4;}
.folder.open .folder-contents{display:block;}
.folder-artworks{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.saved-thumb{position:relative;border-radius:5px;overflow:hidden;aspect-ratio:1;background:#ede9e0;cursor:pointer;border:1px solid #ddd8d0;transition:transform .15s;}
.saved-thumb:hover{transform:scale(1.04);}
.saved-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.saved-thumb-remove{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);border:none;border-radius:50%;width:16px;height:16px;font-size:9px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;}
.saved-thumb:hover .saved-thumb-remove{opacity:1;}
.folder-empty-msg{font-size:10px;color:#bbb;font-family:sans-serif;text-align:center;padding:8px 0;}
.card{position:relative;}
.heart-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.88);border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;opacity:0;transition:opacity .15s,transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2;}
.card:hover .heart-btn{opacity:1;}
.heart-btn.saved{opacity:1;color:#e74c3c;}
.heart-btn:hover{transform:scale(1.15);}
#save-popover{position:fixed;background:#fff;border:1px solid #d8d3c8;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.13);width:200px;z-index:1000;overflow:hidden;display:none;font-family:sans-serif;}
#save-popover.visible{display:block;}
#save-popover-title{font-size:10px;color:#aaa;letter-spacing:.07em;text-transform:uppercase;padding:10px 12px 6px;}
#save-popover-list{max-height:200px;overflow-y:auto;}
.save-popover-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .1s;font-size:12px;color:#333;}
.save-popover-item:hover{background:#f5f2ec;}
.save-popover-item.saved-in{color:#1a3bbf;font-weight:500;}
.item-icon{font-size:13px;flex-shrink:0;}
.item-check{margin-left:auto;font-size:11px;color:#1a3bbf;}
#save-popover-divider{height:1px;background:#ede9e0;margin:2px 0;}
#save-popover-new{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px;color:#1a3bbf;transition:background .1s;}
#save-popover-new:hover{background:#eef1fc;}
#folder-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:2000;display:none;align-items:center;justify-content:center;}
#folder-modal-overlay.visible{display:flex;}
#folder-modal{background:#fff;border-radius:12px;padding:24px;width:280px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
#folder-modal h4{font-size:14px;color:#1a1a1a;margin-bottom:14px;font-family:sans-serif;font-weight:600;}
#folder-modal input{width:100%;padding:9px 12px;border:1px solid #d0cbc0;border-radius:7px;font-size:13px;font-family:sans-serif;outline:none;color:#1a1a1a;transition:border-color .2s;}
#folder-modal input:focus{border-color:#1a3bbf;}
#folder-modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.modal-btn{padding:8px 16px;border-radius:7px;font-size:12px;font-family:sans-serif;cursor:pointer;border:none;transition:background .15s;}
.modal-btn.cancel{background:#f0ede6;color:#888;}.modal-btn.cancel:hover{background:#e5e1d8;}
.modal-btn.confirm{background:#1a3bbf;color:#fff;}.modal-btn.confirm:hover{background:#1530a0;}
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
.top-bar{padding:40px 28px 0;text-align:center;}
.wordmark{font-size:2.4rem;color:#1a3bbf;letter-spacing:.04em;}
.subtitle{font-size:13px;color:#888;margin:6px 0 24px;font-family:sans-serif;}
.search-row{display:flex;justify-content:center;gap:8px;margin-bottom:12px;}
#wordInput{width:260px;padding:10px 16px;background:#fff;border:1px solid #d0cbc0;border-radius:8px;color:#1a1a1a;font-size:14px;font-family:Georgia,serif;outline:none;transition:border-color .2s;}
#wordInput:focus{border-color:#1a3bbf;}
#searchBtn{padding:10px 20px;background:#1a3bbf;color:#fff;border:none;border-radius:8px;font-size:14px;font-family:Georgia,serif;cursor:pointer;}
#searchBtn:hover{background:#1530a0;}
.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;}
.chip{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #d0cbc0;color:#888;background:transparent;cursor:pointer;font-family:sans-serif;transition:all .15s;}
.chip:hover{border-color:#1a3bbf;color:#1a3bbf;}
#source-bar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 28px 0;min-height:28px;}
.src-pill{font-size:10px;font-family:sans-serif;padding:2px 9px;border-radius:99px;border:1px solid #d0cbc0;color:#bbb;}
.src-pill.active{border-color:#1a3bbf;color:#1a3bbf;background:#eef1fc;}
#status{text-align:center;font-size:12px;color:#aaa;padding:6px 28px 4px;font-family:sans-serif;min-height:26px;}
#gallery{columns:3 200px;gap:12px;padding:4px 24px 80px;}
.card{break-inside:avoid;margin-bottom:12px;border-radius:10px;overflow:hidden;border:1px solid #ddd8d0;background:#fff;transition:transform .18s,border-color .18s,box-shadow .18s;cursor:pointer;display:block;color:inherit;text-decoration:none;}
.card:hover{transform:translateY(-3px);border-color:#b8c8f0;box-shadow:0 4px 16px rgba(26,59,191,.08);}
.card img{width:100%;display:block;background:#f0ede6;min-height:60px;}
.cb{padding:10px 12px 12px;}
.ct{font-size:12px;font-weight:bold;color:#1a1a1a;margin-bottom:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ca{font-size:11px;color:#777;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:sans-serif;}
.cm{font-size:10px;color:#aaa;font-family:sans-serif;}
.cs{display:inline-block;margin-top:6px;font-size:10px;padding:2px 7px;border-radius:4px;background:#eeeae1;color:#1a3bbf;font-family:sans-serif;border:1px solid #d8d3c8;}
.loader{display:flex;justify-content:center;padding:3rem;gap:7px;}
.dot{width:7px;height:7px;border-radius:50%;background:#ccc;animation:pulse 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
.empty{text-align:center;padding:4rem 1rem;color:#bbb;font-size:.95rem;font-family:sans-serif;line-height:1.7;}
#word-error{font-size:11px;color:#c0392b;font-family:sans-serif;text-align:center;min-height:16px;margin-top:4px;}
/* Etymology modal */
#etym-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:3000;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
#etym-overlay.open{display:flex;}
#etym-box{background:#fff;border-radius:12px;width:100%;max-width:680px;box-shadow:0 16px 48px rgba(0,0,0,.22);overflow:hidden;margin:auto;position:relative;}
#etym-art-img{width:100%;display:block;}
#etym-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);border:1px solid #d0cbc0;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1a1a1a;line-height:1;font-family:sans-serif;z-index:10;}
#etym-close:hover{background:#f5f2ec;}
#etym-body{padding:20px 24px 28px;}
#etym-art-title{font-size:15px;font-weight:bold;color:#1a1a1a;margin-bottom:2px;}
#etym-art-meta{font-size:12px;color:#888;font-family:sans-serif;margin-bottom:4px;}
#etym-art-link{font-size:11px;color:#1a3bbf;text-decoration:none;font-family:sans-serif;}
#etym-art-link:hover{text-decoration:underline;}
.etym-divider{border:none;border-top:1px solid #e8e3da;margin:16px 0;}
#etym-word{font-size:26px;color:#1a3bbf;letter-spacing:.03em;margin-bottom:2px;}
#etym-pos{font-size:11px;color:#aaa;font-family:sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
.etym-loading{display:flex;align-items:center;gap:8px;font-size:13px;color:#aaa;font-family:sans-serif;padding:8px 0;}
.etym-section{margin-bottom:14px;}
.etym-label{font-size:10px;color:#bbb;font-family:sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.etym-text{font-size:14px;color:#333;line-height:1.65;}
.etym-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.etym-chip{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #d0cbc0;color:#1a3bbf;background:transparent;cursor:pointer;font-family:sans-serif;transition:all .15s;}
.etym-chip:hover{background:#1a3bbf;color:#fff;border-color:#1a3bbf;}
.etym-chip-hint{font-size:10px;color:#bbb;font-family:sans-serif;margin-top:6px;}
/* Cognate tree */
.cognate-tree{margin-top:8px;}
.cognate-lang-group{margin-bottom:12px;}
.cognate-lang{font-size:10px;color:#aaa;font-family:sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;padding-left:2px;}
.cognate-words{display:flex;flex-wrap:wrap;gap:5px;}
.cognate-word{font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid #d0cbc0;color:#1a3bbf;background:transparent;cursor:pointer;font-family:sans-serif;transition:all .15s;position:relative;}
.cognate-word:hover{background:#1a3bbf;color:#fff;border-color:#1a3bbf;}
.cognate-word .cog-gloss{display:none;position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:10px;padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:10;}
.cognate-word:hover .cog-gloss{display:block;}
.cog-search-note{font-size:10px;color:#bbb;font-family:sans-serif;margin-top:8px;font-style:italic;}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <div class="logo">word to art</div>
    <p>Click a country to filter by culture</p>
  </div>
  <div id="map-section">
    <h3>World map</h3>
    <svg id="world-map" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hover-name">Hover a country</div>
    <button id="clear-btn" onclick="clearFilter()">x Clear country filter</button>
  </div>
  <div id="collections-section">
    <div id="collections-header">
      <h3>My collections</h3>
      <button id="new-folder-btn" title="New collection">+</button>
    </div>
    <div id="collections-list"></div>
  </div>
</div>

<div id="main">
  <div class="top-bar">
    <div class="wordmark">word to art</div>
    <p class="subtitle">Enter a word. See how cultures across history visualized it.</p>
    <div class="search-row">
      <input type="text" id="wordInput" placeholder="one word — lion, grief, fire..."/>
      <button id="searchBtn">Explore</button>
    </div>
    <div id="word-error"></div>
    <div class="chips">
      <button class="chip" onclick="qs('water')">water</button>
      <button class="chip" onclick="qs('love')">love</button>
      <button class="chip" onclick="qs('death')">death</button>
      <button class="chip" onclick="qs('sun')">sun</button>
      <button class="chip" onclick="qs('war')">war</button>
      <button class="chip" onclick="qs('woman')">woman</button>
      <button class="chip" onclick="qs('horse')">horse</button>
      <button class="chip" onclick="qs('flower')">flower</button>
    </div>
  </div>
  <div id="source-bar"></div>
  <div id="status"></div>
  <div id="gallery"></div>
</div>

<div id="save-popover">
  <div id="save-popover-title">Save to collection</div>
  <div id="save-popover-list"></div>
  <div id="save-popover-divider"></div>
  <div id="save-popover-new">+ New collection</div>
</div>

<div id="folder-modal-overlay">
  <div id="folder-modal">
    <h4>New collection</h4>
    <input type="text" id="folder-name-input" placeholder="e.g. Favourites, Japanese Art..." maxlength="40"/>
    <div id="folder-modal-actions">
      <button class="modal-btn cancel" id="modal-cancel-btn">Cancel</button>
      <button class="modal-btn confirm" id="modal-confirm-btn">Create</button>
    </div>
  </div>
</div>

<div id="etym-overlay">
  <div id="etym-box">
    <button id="etym-close" aria-label="Close">&#215;</button>
    <img id="etym-art-img" src="" alt="">
    <div id="etym-body">
      <div id="etym-art-title"></div>
      <div id="etym-art-meta"></div>
      <a id="etym-art-link" href="#" target="_blank" rel="noopener"></a>
      <hr class="etym-divider">
      <div id="etym-word"></div>
      <div id="etym-pos"></div>
      <div id="etym-content"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const G = document.getElementById('gallery');
const ST = document.getElementById('status');
const WI = document.getElementById('wordInput');
const HN = document.getElementById('hover-name');
const CB = document.getElementById('clear-btn');
const SB = document.getElementById('source-bar');

let activeLabel = null;
let activeTerm = null;

const CN = {
  4:'Afghanistan',8:'Albania',12:'Algeria',24:'Angola',32:'Argentina',36:'Australia',
  40:'Austria',50:'Bangladesh',56:'Belgium',64:'Bhutan',68:'Bolivia',76:'Brazil',
  100:'Bulgaria',116:'Cambodia',120:'Cameroon',124:'Canada',144:'Sri Lanka',
  152:'Chile',156:'China',170:'Colombia',188:'Costa Rica',191:'Croatia',
  192:'Cuba',196:'Cyprus',203:'Czech Republic',208:'Denmark',218:'Ecuador',
  818:'Egypt',231:'Ethiopia',246:'Finland',250:'France',276:'Germany',
  288:'Ghana',300:'Greece',320:'Guatemala',332:'Haiti',340:'Honduras',
  348:'Hungary',356:'India',360:'Indonesia',364:'Iran',368:'Iraq',
  372:'Ireland',376:'Israel',380:'Italy',388:'Jamaica',392:'Japan',
  400:'Jordan',398:'Kazakhstan',404:'Kenya',410:'South Korea',422:'Lebanon',
  434:'Libya',484:'Mexico',504:'Morocco',508:'Mozambique',516:'Namibia',
  524:'Nepal',528:'Netherlands',554:'New Zealand',566:'Nigeria',578:'Norway',
  586:'Pakistan',604:'Peru',608:'Philippines',616:'Poland',620:'Portugal',
  643:'Russia',646:'Rwanda',682:'Saudi Arabia',686:'Senegal',
  706:'Somalia',710:'South Africa',724:'Spain',729:'Sudan',752:'Sweden',
  756:'Switzerland',760:'Syria',764:'Thailand',788:'Tunisia',792:'Turkey',
  800:'Uganda',804:'Ukraine',826:'United Kingdom',840:'United States of America',
  858:'Uruguay',862:'Venezuela',704:'Vietnam',887:'Yemen',716:'Zimbabwe',
  496:'Mongolia',104:'Myanmar',466:'Mali',
};

const CT = {
  'China':'Chinese','Japan':'Japanese','South Korea':'Korean','India':'Indian',
  'Egypt':'Egyptian','Greece':'Greek','Italy':'Roman Italian','France':'French',
  'Germany':'German','Spain':'Spanish','Netherlands':'Dutch Flemish',
  'United Kingdom':'British English','Russia':'Russian',
  'United States of America':'American','Mexico':'Mexican pre-Columbian',
  'Peru':'Andean Inca','Brazil':'Brazilian','Iran':'Persian Iranian',
  'Turkey':'Ottoman Turkish','Iraq':'Mesopotamian Assyrian','Nigeria':'Yoruba Nigerian',
  'Ethiopia':'Ethiopian','Ghana':'Ghanaian Akan','Mali':'Malian',
  'Indonesia':'Indonesian','Thailand':'Thai','Cambodia':'Khmer Cambodian',
  'Vietnam':'Vietnamese','Australia':'Aboriginal Australian','New Zealand':'Maori',
  'Pakistan':'Mughal Pakistani','Afghanistan':'Gandhara Afghan',
  'Syria':'Syrian ancient','Lebanon':'Phoenician Lebanese',
  'Israel':'Jewish ancient','Saudi Arabia':'Islamic Arabian',
  'Morocco':'Moroccan Islamic','Sudan':'Nubian Sudanese',
  'South Africa':'South African','Argentina':'Argentine',
  'Colombia':'Colombian pre-Columbian','Guatemala':'Maya Guatemalan',
  'Portugal':'Portuguese','Belgium':'Flemish Belgian','Austria':'Austrian Habsburg',
  'Poland':'Polish','Sweden':'Norse Swedish','Norway':'Norse Norwegian',
  'Denmark':'Viking Danish','Mongolia':'Mongolian','Nepal':'Nepalese Himalayan',
  'Sri Lanka':'Buddhist Sri Lankan',
};

function applyFilter(label, term) {
  activeLabel = label; activeTerm = term;
  HN.textContent = label; HN.classList.add('has-filter');
  CB.classList.add('visible');
  const w = WI.value.trim(); if (w) search(w);
}

function clearFilter() {
  activeLabel = null; activeTerm = null;
  HN.textContent = 'Hover a country'; HN.classList.remove('has-filter');
  CB.classList.remove('visible');
  document.querySelectorAll('#world-map path').forEach(p => { p.classList.remove('selected'); p.style.fill = ''; });
  const w = WI.value.trim(); if (w) search(w);
}

const mapSvg = d3.select('#world-map');
const proj = d3.geoNaturalEarth1().scale(130).translate([400, 235]);
const pathGen = d3.geoPath(proj);

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
  const features = topojson.feature(world, world.objects.countries).features;
  mapSvg.selectAll('path').data(features).join('path').attr('d', pathGen)
    .on('mouseenter', function(event, d) {
      const name = CN[+d.id];
      if (!this.classList.contains('selected')) this.style.fill = CT[name] ? '#b8c8f0' : '#ccc';
      if (name) { HN.textContent = CT[name] ? name : name + ' (no filter)'; HN.classList.toggle('has-filter', !!activeLabel); }
    })
    .on('mouseleave', function(event, d) {
      if (!this.classList.contains('selected')) this.style.fill = '';
      HN.textContent = activeLabel || 'Hover a country'; HN.classList.toggle('has-filter', !!activeLabel);
    })
    .on('click', function(event, d) {
      const name = CN[+d.id]; if (!name || !CT[name]) return;
      document.querySelectorAll('#world-map path').forEach(p => { p.classList.remove('selected'); p.style.fill = ''; });
      this.classList.add('selected'); this.style.fill = '';
      applyFilter(name, CT[name]);
    })
    .append('title').text(d => CN[+d.id] || '');
});

// ============================================================
// COLLECTIONS
// ============================================================

const STORAGE_KEY = 'word_art_collections_v2';

function loadCols() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveCols(c) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(c));
}

function artId(art) {
  const str = (art.url || art.title || art.image || '');
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return (h >>> 0).toString(36);
}

function isSaved(art) {
  const id = artId(art);
  return Object.values(loadCols()).some(c => c.artworks.some(a => a.id === id));
}

function isInCol(colId, art) {
  const cols = loadCols();
  if (!cols[colId]) return false;
  const id = artId(art);
  return cols[colId].artworks.some(a => a.id === id);
}

function createCol(name) {
  const cols = loadCols();
  const id = 'c' + Date.now();
  cols[id] = { name: name, artworks: [], open: true };
  saveCols(cols);
  renderCols();
  return id;
}

function deleteCol(colId) {
  const cols = loadCols();
  delete cols[colId];
  saveCols(cols);
  renderCols();
  refreshHearts();
}

function renameCol(colId) {
  const cols = loadCols();
  if (!cols[colId]) return;
  const n = prompt('Rename collection:', cols[colId].name);
  if (n && n.trim()) { cols[colId].name = n.trim().slice(0,40); saveCols(cols); renderCols(); }
}

// KEY FIX: toggleInCol no longer calls renderCols() or refreshHearts().
// The caller is responsible for updating UI after the data change.
// This prevents the popover's DOM from being blown away mid-click.
function toggleInCol(colId, art) {
  const cols = loadCols();
  if (!cols[colId]) return;
  const id = artId(art);
  const idx = cols[colId].artworks.findIndex(a => a.id === id);
  if (idx > -1) {
    cols[colId].artworks.splice(idx, 1);
  } else {
    cols[colId].artworks.unshift({ id: id, title: art.title, image: art.image, url: art.url, source: art.source });
  }
  saveCols(cols);
  // Callers must call renderCols() and refreshHearts() themselves after this
}

function removeFromCol(colId, artworkId) {
  const cols = loadCols();
  if (!cols[colId]) return;
  cols[colId].artworks = cols[colId].artworks.filter(a => a.id !== artworkId);
  saveCols(cols);
  renderCols();
  refreshHearts();
}

function toggleColOpen(colId) {
  const cols = loadCols();
  if (!cols[colId]) return;
  cols[colId].open = !cols[colId].open;
  saveCols(cols);
  renderCols();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCols() {
  const list = document.getElementById('collections-list');
  const cols = loadCols();
  const keys = Object.keys(cols);
  if (!keys.length) {
    list.innerHTML = '<div class="collection-empty">Heart artworks to save them.<br>Use + to create a collection.</div>';
    return;
  }
  list.innerHTML = keys.map(function(id) {
    const col = cols[id];
    const count = col.artworks.length;
    const thumbs = count === 0
      ? '<div class="folder-empty-msg">No artworks yet</div>'
      : col.artworks.map(function(a) {
          return '<div class="saved-thumb" onclick="window.open(\'' + esc(a.url||'') + '\',\'_blank\')">'
            + '<img src="' + esc(a.image) + '" loading="lazy" onerror="this.style.display=\'none\'">'
            + '<button class="saved-thumb-remove" onclick="event.stopPropagation();removeFromCol(\'' + id + '\',\'' + a.id + '\')">x</button>'
            + '</div>';
        }).join('');
    return '<div class="folder ' + (col.open ? 'open' : '') + '" id="fld-' + id + '">'
      + '<div class="folder-header" onclick="toggleColOpen(\'' + id + '\')">'
      + '<span class="folder-chevron">&#9658;</span>'
      + '<span class="folder-icon">&#128194;</span>'
      + '<span class="folder-name">' + esc(col.name) + '</span>'
      + '<span class="folder-count">' + count + '</span>'
      + '<span class="folder-actions" onclick="event.stopPropagation()">'
      + '<button class="folder-action-btn" onclick="renameCol(\'' + id + '\')">&#9998;</button>'
      + '<button class="folder-action-btn" onclick="deleteCol(\'' + id + '\')">&#10005;</button>'
      + '</span></div>'
      + '<div class="folder-contents"><div class="folder-artworks">' + thumbs + '</div></div>'
      + '</div>';
  }).join('');
}

// heartMap: artId string -> Set of button elements
// Keyed by stable ID string, not DOM element, so renderCols() doesn't invalidate it
const heartMap = new Map(); // artId -> art object (for isSaved lookups)
const heartBtns = new Map(); // artId -> Set<button> (all buttons for that art across renders)

function refreshHearts() {
  heartBtns.forEach(function(btnSet, id) {
    btnSet.forEach(function(btn) {
      if (!btn.isConnected) { btnSet.delete(btn); return; }
      const saved = heartMap.has(id) && isSaved(heartMap.get(id));
      btn.classList.toggle('saved', saved);
      btn.textContent = saved ? '\u2665' : '\u2661';
    });
  });
}

// POPOVER
// ============================================================

const popover = document.getElementById('save-popover');
const popoverList = document.getElementById('save-popover-list');

let pendingArt = null;

function renderPopover() {
  if (!pendingArt) return;
  const cols = loadCols();
  const keys = Object.keys(cols);
  popoverList.innerHTML = '';
  if (!keys.length) {
    popoverList.innerHTML = '<div style="font-size:11px;color:#999;padding:8px 12px;">No collections yet</div>';
    return;
  }
  keys.forEach(function(id) {
    const inCol = isInCol(id, pendingArt);
    const row = document.createElement('div');
    row.className = 'save-popover-item' + (inCol ? ' saved-in' : '');
    row.dataset.colid = id;
    row.innerHTML = '<span class="item-icon">&#128194;</span>'
      + '<span>' + esc(cols[id].name) + '</span>'
      + (inCol ? '<span class="item-check">&#10003;</span>' : '');
    popoverList.appendChild(row);
  });
}

function outsideClickHandler(e) {
  if (!popover.contains(e.target)) closePopover();
}

function showPopover(btn, art) {
  pendingArt = art;
  renderPopover();
  const rect = btn.getBoundingClientRect();
  popover.style.top = (rect.bottom + 6 + window.scrollY) + 'px';
  let left = rect.left + window.scrollX - 80;
  if (left < 8) left = 8;
  if (left + 200 > window.innerWidth - 8) left = window.innerWidth - 208;
  popover.style.left = left + 'px';
  popover.classList.add('visible');
  // Defer adding the outside-click listener until AFTER this click event finishes,
  // otherwise the heart-button click that opened the popover immediately closes it.
  setTimeout(function() {
    document.addEventListener('click', outsideClickHandler);
  }, 0);
}

function closePopover() {
  popover.classList.remove('visible');
  document.removeEventListener('click', outsideClickHandler);
  // DO NOT clear pendingArt — modal flow needs it
}

// Popover row clicks
popoverList.addEventListener('click', function(e) {
  const item = e.target.closest('[data-colid]');
  if (!item) return;
  const colId = item.dataset.colid;
  toggleInCol(colId, pendingArt);
  // Update just this row in-place — don't rebuild the whole popover
  const inCol = isInCol(colId, pendingArt);
  item.className = 'save-popover-item' + (inCol ? ' saved-in' : '');
  item.innerHTML = '<span class="item-icon">&#128194;</span>'
    + '<span>' + esc(loadCols()[colId].name) + '</span>'
    + (inCol ? '<span class="item-check">&#10003;</span>' : '');
  // Update sidebar and hearts without touching the popover DOM
  renderCols();
  refreshHearts();
});

const modalOverlay = document.getElementById('folder-modal-overlay');

function confirmModal() {
  const name = folderInput.value.trim();
  if (!name) { folderInput.focus(); return; }
  const newId = createCol(name);

}

const wordError = document.getElementById('word-error');

function validateWord(raw) {
  const v = raw.trim();
  if (!v) return { ok: false, word: '', msg: '' };
  if (/\s/.test(v)) return { ok: false, word: '', msg: 'Please enter a single word — no spaces.' };
  if (v.length > 40) return { ok: false, word: '', msg: 'That word is too long.' };
  return { ok: true, word: v, msg: '' };
}

WI.addEventListener('input', function() {
  const { msg } = validateWord(WI.value);
  wordError.textContent = msg;
});

  wordError.textContent = msg;
  if (ok) { WI.value = word; search(word); }
});

});

function renderEtymContent(etym, word) {
  const posEl = document.getElementById('etym-pos');
  const contentEl = document.getElementById('etym-content');
  if (!contentEl) return;
  if (etym.partOfSpeech) posEl.textContent = etym.partOfSpeech;

  let html = '';

  if (etym.origin) html += '<div class="etym-section"><div class="etym-label">Origin</div><div class="etym-text">' + esc(etym.origin) + '</div></div>';
  if (etym.meaning) html += '<div class="etym-section"><div class="etym-label">Root meaning</div><div class="etym-text">' + esc(etym.meaning) + '</div></div>';

  // Cognate tree — grouped by language, each word clickable
  if (etym.cognates && Object.keys(etym.cognates).length) {
    html += '<div class="etym-section"><div class="etym-label">Cognate tree — click any word to search art</div><div class="cognate-tree">';
    Object.entries(etym.cognates).forEach(function(entry) {
      const lang = entry[0], words = entry[1];
      if (!words.length) return;
      html += '<div class="cognate-lang-group"><div class="cognate-lang">' + esc(lang) + '</div><div class="cognate-words">';
      words.forEach(function(cog) {
        html += '<button class="cognate-word" data-word="' + esc(cog.word) + '">'
          + esc(cog.word)
          + (cog.gloss ? '<span class="cog-gloss">' + esc(cog.gloss) + '</span>' : '')
          + '</button>';
      });
      html += '</div></div>';
    });
    html += '</div><div class="cog-search-note">Hover a word to see its meaning · click to open an art gallery for that word</div></div>';
  }

  // Related / derived terms as chips (separate from cognates)
  if (etym.related && etym.related.length) {
    html += '<div class="etym-section"><div class="etym-label">Derived &amp; related terms</div>'
      + '<div class="etym-chips">' + etym.related.map(function(w){ return '<button class="etym-chip" data-word="' + esc(w) + '">' + esc(w) + '</button>'; }).join('') + '</div></div>';
  }

  if (!html) html = '<div class="etym-text" style="color:#bbb;font-style:italic">No detailed etymology found.</div>';
  contentEl.innerHTML = html;

  // Wire up cognate word buttons
  contentEl.querySelectorAll('.cognate-word').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const w = btn.dataset.word;
      if (!w) return;
      etymOverlay.classList.remove('open');
      WI.value = w;
      wordError.textContent = '';
      currentSearchWord = w;
      heartMap.clear();
      heartBtns.clear();
      search(w);
    });
  });

  // Wire up related chips
  contentEl.querySelectorAll('.etym-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      const w = chip.dataset.word;
      etymOverlay.classList.remove('open');
      WI.value = w;
      wordError.textContent = '';
      currentSearchWord = w;
      heartMap.clear();
      heartBtns.clear();
      search(w);
    });
  });
}

// ============================================================
// WIKTIONARY ETYMOLOGY + COGNATE FETCH
// ============================================================

const LANG_CODES = {
  'la':'Latin','grc':'Ancient Greek','ang':'Old English','fro':'Old French',
  'gem':'Proto-Germanic','non':'Old Norse','de':'German','fr':'French',
  'it':'Italian','es':'Spanish','ar':'Arabic','sa':'Sanskrit','zh':'Chinese',
  'ja':'Japanese','got':'Gothic','ine':'Proto-Indo-European','nl':'Dutch',
  'pt':'Portuguese','ru':'Russian','pl':'Polish','cs':'Czech','sv':'Swedish',
  'da':'Danish','no':'Norwegian','fi':'Finnish','hu':'Hungarian','ro':'Romanian',
  'ca':'Catalan','oc':'Occitan','af':'Afrikaans','cy':'Welsh','ga':'Irish',
  'gd':'Scottish Gaelic','is':'Icelandic','lt':'Lithuanian','lv':'Latvian',
  'el':'Greek','fa':'Persian','hi':'Hindi','bn':'Bengali','ta':'Tamil',
  'ko':'Korean','vi':'Vietnamese','tr':'Turkish','he':'Hebrew','yi':'Yiddish',
  'enm':'Middle English','gmh':'Middle High German','goh':'Old High German',
  'pro':'Old Provençal','VL.':'Vulgar Latin','LL.':'Late Latin',
  'ML.':'Medieval Latin','NL.':'New Latin'
};

async function fetchEtymology(word) {
  const base = 'https://en.wiktionary.org/w/api.php';
  const params = '?action=parse&page=' + encodeURIComponent(word) + '&prop=wikitext&format=json&origin=*';
  const resp = await fetch(base + params);
  if (!resp.ok) throw new Error('Wiktionary unavailable');
  const data = await resp.json();
  if (data.error || !data.parse) throw new Error('Word not found');
  return parseWikitext(data.parse.wikitext['*'] || '', word);
}

function parseWikitext(wikitext, word) {
  function resolveCode(code) { return LANG_CODES[code] || code; }

  // Collapse ALL {{...}} templates — iteratively handles nesting
  function removeAllTemplates(s) {
    let prev;
    do {
      prev = s;
      s = s.replace(/\{\{[^{}]*\}\}/g, '');
    } while (s !== prev);
    return s;
  }

  // For origin text: strip templates but try to salvage the word form from m/l/der/inh/bor/cog
  function stripTemplates(s) {
    // Extract readable word from linguistic templates before removing them
    // {{der|en|la|aqua|t=water}} → aqua
    s = s.replace(/\{\{(?:m|l|der|inh|bor|cog|etyl|mention|link)\|[^|{}]*\|[^|{}]*\|([^|{}=*\n][^|{}=\n]*?)(?:\|[^{}]*)?\}\}/gi, function(_, w){ return w.trim(); });
    // {{m|la|aqua}} (2-arg form) → aqua
    s = s.replace(/\{\{(?:m|l)\|[^|{}]*\|([^|{}=*\n]+?)\}\}/gi, function(_, w){ return w.trim(); });
    // Nuke everything else
    s = removeAllTemplates(s);
    // Wikilinks
    s = s.replace(/\[\[(?:[^\]|]+\|)?([^\]]+)\]\]/g, '$1');
    // Bold/italic
    s = s.replace(/'''?/g, '');
    // Stray symbols left by mangled templates
    s = s.replace(/\*\s*t\s*\*/g, ' ');
    s = s.replace(/\|\s*t\s*=/g, ' ');
    s = s.replace(/[|*=]+/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  // Isolate English section
  const englishMatch = wikitext.match(/==English==\s*([\s\S]*?)(?:\n==[^=]|$)/);
  const englishText = englishMatch ? englishMatch[1] : wikitext;

  // Part of speech
  let partOfSpeech = '';
  const posMatch = englishText.match(/===\s*(Noun|Verb|Adjective|Adverb|Pronoun|Preposition|Conjunction|Interjection|Determiner)\s*===/i);
  if (posMatch) partOfSpeech = posMatch[1].toLowerCase();

  // Etymology section raw
  let origin = '';
  const etymMatch = englishText.match(/===?\s*Etymology\s*[12]?\s*===?\s*\n([\s\S]*?)(?:\n===|$)/i);
  const etymRaw = etymMatch ? etymMatch[1] : '';
  if (etymRaw) {
    const cleaned = stripTemplates(etymRaw).split('\n').filter(function(l){return l.trim();}).join(' ');
    origin = cleaned.substring(0, 380);
    if (cleaned.length > 380) origin += '…';
  }

  // ── COGNATE EXTRACTION ──
  // Wiktionary encodes cognates as {{cog|lang|word|gloss=meaning}} or {{cog|lang|word|t=meaning}}
  // Also picks up {{der|en|lang|word}}, {{inh|en|lang|word}}, {{bor|en|lang|word}} as ancestry
  const cognates = {}; // lang → [{word, gloss}]

  // 1. Explicit {{cog|...}} cognates
  const cogRegex = /\{\{cog\|([a-z\-]+)\|([^|{}=\n]+?)(?:\|(?:gloss|t)=([^|}]+))?\}\}/gi;
  let m;
  while ((m = cogRegex.exec(etymRaw)) !== null) {
    const lang = resolveCode(m[1]);
    const w = m[2].trim();
    const gloss = m[3] ? m[3].trim() : '';
    if (!w || w.length > 30) continue;
    if (!cognates[lang]) cognates[lang] = [];
    if (!cognates[lang].some(function(c){return c.word===w;})) cognates[lang].push({word:w, gloss});
  }

  // 2. Ancestry: {{inh|en|lang|word}}, {{der|en|lang|word}}, {{bor|en|lang|word}}
  const ancRegex = /\{\{(?:inh|der|bor)\|en\|([a-z\-]+)\|([^|{}=\n]+?)(?:\|(?:gloss|t)=([^|}]+))?\}\}/gi;
  while ((m = ancRegex.exec(etymRaw)) !== null) {
    const lang = resolveCode(m[1]);
    const w = m[2].trim();
    if (!w || w === 'en' || w.length > 30) continue;
    const gloss = m[3] ? m[3].trim() : '';
    if (!cognates[lang]) cognates[lang] = [];
    if (!cognates[lang].some(function(c){return c.word===w;})) cognates[lang].push({word:w, gloss});
  }

  // 3. Also scan the full Descendants / Cognates section if present
  const cogSectionMatch = englishText.match(/===?\s*(?:Cognates?|Descendants?|Related terms)\s*===?\s*\n([\s\S]*?)(?:\n===|$)/i);
  if (cogSectionMatch) {
    const cogRegex2 = /\{\{(?:cog|l|m)\|([a-z\-]+)\|([^|{}=\n]+?)(?:\|(?:gloss|t)=([^|}]+))?\}\}/gi;
    while ((m = cogRegex2.exec(cogSectionMatch[1])) !== null) {
      const lang = resolveCode(m[1]);
      if (lang === 'English' || lang === 'en') continue;
      const w = m[2].trim();
      if (!w || w.length > 30) continue;
      const gloss = m[3] ? m[3].trim() : '';
      if (!cognates[lang]) cognates[lang] = [];
      if (!cognates[lang].some(function(c){return c.word===w;})) cognates[lang].push({word:w, gloss});
    }
  }

  // First definition
  let meaning = '';
  const defMatch = englishText.match(/^#\s*([^#\n*:].+)/m);
  if (defMatch) meaning = stripTemplates(defMatch[1]).substring(0, 200);

  // Related / derived terms (English words only — for chips)
  let related = [];
  const relSection = englishText.match(/===?\s*(?:Related terms|Derived terms|Synonyms)\s*===?\s*\n([\s\S]*?)(?:\n===|$)/i);
  if (relSection) {
    related = [...relSection[1].matchAll(/\[\[([a-z][a-z\s\-']+)\]\]/gi)]
      .map(function(mx){return mx[1].trim();})
      .filter(function(w){return w !== word && w.length > 2 && w.length < 20;});
    related = [...new Set(related)].slice(0, 8);
  }
  if (!related.length) {
    const seeAlso = englishText.match(/===?\s*See also\s*===?\s*\n([\s\S]*?)(?:\n===|$)/i);
    if (seeAlso) {
      related = [...seeAlso[1].matchAll(/\[\[([a-z][a-z\s\-']+)\]\]/gi)]
        .map(function(mx){return mx[1].trim();})
        .filter(function(w){return w !== word && w.length > 2 && w.length < 20;});
      related = [...new Set(related)].slice(0, 8);
    }
  }

  if (!origin && !meaning && !Object.keys(cognates).length && !related.length) throw new Error('No data');
  return { partOfSpeech, origin, meaning, cognates, related };
}

const ALL_SOURCES = ['The Met','Art Inst. Chicago','Cleveland Museum','V&A','Harvard Art','Europeana','Wikimedia'];

function renderSourceBar(active) {

    return '<span class="src-pill ' + (active.has(s) ? 'active' : '') + '">' + s + '</span>';

async function search(word) {
  currentSearchWord = word;
  G.innerHTML = '<div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  SB.innerHTML = '';
  const note = activeLabel ? ' - ' + activeLabel : '';
  ST.textContent = 'Searching collections' + note + '...';
  const q = activeTerm ? word + ' ' + activeTerm : word;

  // Clear stale heart registrations from previous search
  heartMap.clear();
  heartBtns.clear();

  const results = await Promise.allSettled([
    searchMet(q), searchChicago(q), searchCleveland(q), searchVA(q),
    searchHarvard(q), searchEuropeana(q), searchWikimedia(q),
  ]);

  let arts = results.filter(function(r) { return r.status === 'fulfilled'; })
    .flatMap(function(r) { return r.value; })
    .filter(function(a) { return a.image; });

  for (let i = arts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arts[i], arts[j]] = [arts[j], arts[i]];
  }

  G.innerHTML = '';
  const sources = new Set(arts.map(function(a) { return a.source; }));
  renderSourceBar(sources);

  if (!arts.length) {
    ST.textContent = '';
    G.innerHTML = '<div class="empty">No artworks found for <em>' + word + '</em>' + note + '.<br>Try a different word or clear the country filter.</div>';
    return;
  }
  ST.textContent = arts.length + ' works found for "' + word + '"' + note + ' - ' + sources.size + ' collection' + (sources.size > 1 ? 's' : '');
  arts.forEach(function(a) { G.appendChild(makeCard(a)); });
}

function makeCard(art) {
  const id = artId(art);
  const el = document.createElement('div');
  el.className = 'card';
  el.style.cursor = 'pointer';

  el.innerHTML = '<img src="' + (art.image||'') + '" alt="" loading="lazy" onerror="this.closest(\'.card\').remove()"/>'
    + '<div class="cb">'
    + '<div class="ct">' + esc(art.title||'Untitled') + '</div>'
    + '<div class="ca">' + esc(art.artist||'Unknown artist') + '</div>'
    + '<div class="cm">' + esc([art.date,art.culture].filter(Boolean).join(' - ')) + '</div>'
    + '<span class="cs">' + esc(art.source) + '</span>'
    + '</div>';

  const btn = document.createElement('button');
  const saved = isSaved(art);
  btn.className = 'heart-btn' + (saved ? ' saved' : '');
  btn.title = 'Save to collection';
  btn.textContent = saved ? '\u2665' : '\u2661';

  // Register in both maps keyed by stable art ID
  heartMap.set(id, art);
  if (!heartBtns.has(id)) heartBtns.set(id, new Set());
  heartBtns.get(id).add(btn);

  btn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const cols = loadCols();
    if (!Object.keys(cols).length) {
      pendingArt = art;
      openModal(true);
    } else {
      showPopover(btn, art);
    }
  });

  el.addEventListener('click', function(e) {
    if (e.target === btn || btn.contains(e.target)) return;
    openEtymModal(art, currentSearchWord);
  });

  el.insertBefore(btn, el.firstChild);
  return el;
}

// ============================================================
// MUSEUM APIs
// ============================================================

async function searchMet(q) {
  try {
    const s = await fetch('https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q=' + encodeURIComponent(q)).then(function(r){return r.json();});
    if (!s.objectIDs) return [];
    const det = await Promise.all(s.objectIDs.slice(0,15).map(function(id){return fetch('https://collectionapi.metmuseum.org/public/collection/v1/objects/'+id).then(function(r){return r.json();}).catch(function(){return null;});}));
    return det.filter(Boolean).map(function(o){return {title:o.title,artist:o.artistDisplayName,date:o.objectDate,culture:o.culture,image:o.primaryImageSmall,source:'The Met',url:o.objectURL};}).filter(function(a){return a.image;});
  } catch(e){return [];}
}

async function searchChicago(q) {
  try {
    const d = await fetch('https://api.artic.edu/api/v1/artworks/search?q=' + encodeURIComponent(q) + '&limit=15&fields=id,title,artist_display,date_display,image_id,place_of_origin').then(function(r){return r.json();});
    if (!d.data) return [];
    return d.data.map(function(o){return {title:o.title,artist:o.artist_display,date:o.date_display,culture:o.place_of_origin,image:o.image_id?'https://www.artic.edu/iiif/2/'+o.image_id+'/full/400,/0/default.jpg':null,source:'Art Inst. Chicago',url:'https://www.artic.edu/artworks/'+o.id};}).filter(function(a){return a.image;});
  } catch(e){return [];}
}

async function searchCleveland(q) {
  try {
    const d = await fetch('https://openaccess-api.clevelandart.org/api/artworks?q=' + encodeURIComponent(q) + '&has_image=1&limit=15').then(function(r){return r.json();});
    if (!d.data) return [];
    return d.data.map(function(o){return {title:o.title,artist:o.creators&&o.creators[0]?o.creators[0].description:'',date:o.creation_date,culture:o.culture?o.culture.join(', '):'',image:o.images&&o.images.web?o.images.web.url:null,source:'Cleveland Museum',url:o.url};}).filter(function(a){return a.image;});
  } catch(e){return [];}
}

async function searchVA(q) {
  try {
    const d = await fetch('https://api.vam.ac.uk/v2/objects/search?q=' + encodeURIComponent(q) + '&images_exist=true&page_size=15').then(function(r){return r.json();});
    if (!d.records) return [];
    return d.records.map(function(o){return {title:(o.fields&&o.fields.object)||'Untitled',artist:(o.fields&&o.fields.artist)||'',date:(o.fields&&o.fields.date_text)||'',culture:(o.fields&&o.fields.place)||'',image:(o.fields&&o.fields.primary_image_id)?'https://framemark.vam.ac.uk/collections/'+o.fields.primary_image_id+'/full/400,/0/default.jpg':null,source:'V&A',url:'https://collections.vam.ac.uk/item/'+(o.fields&&o.fields.systemNumber||'')};}).filter(function(a){return a.image;});
  } catch(e){return [];}
}

async function searchHarvard(q) {
  try {
    const d = await fetch('/api/harvard?q=' + encodeURIComponent(q)).then(function(r){return r.json();});
    if (!d.records) return [];
    return d.records.map(function(o){return {title:o.title,artist:o.people&&o.people[0]?o.people[0].displayname:'',date:o.dated||'',culture:o.culture||'',image:o.primaryimageurl,source:'Harvard Art',url:o.url};}).filter(function(a){return a.image;});
  } catch(e){return [];}
}

async function searchEuropeana(q) {
  try {
    const d = await fetch('/api/europeana?q=' + encodeURIComponent(q)).then(function(r){return r.json();});
    if (!d.items) return [];
    return d.items.map(function(o){return {title:Array.isArray(o.title)?o.title[0]:o.title||'Untitled',artist:Array.isArray(o.dcCreator)?o.dcCreator[0]:'',date:o.year&&o.year[0]?o.year[0]:'',culture:o.dataProvider&&o.dataProvider[0]?o.dataProvider[0]:'',image:o.edmPreview&&o.edmPreview[0]?o.edmPreview[0]:null,source:'Europeana',url:o.guid};}).filter(function(a){return a.image;});
  } catch(e){return [];}
}

async function searchWikimedia(q) {
  try {
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(q + ' painting artwork') + '&srnamespace=6&srlimit=30&srprop=snippet&format=json&origin=*';
    const d = await fetch(url).then(function(r){return r.json();});
    if (!d.query||!d.query.search) return [];
    return d.query.search.map(function(o) {
      const title = o.title.replace(/^File:/,'').replace(/\.[^.]+$/,'');
      const file = o.title.replace(/^File:/,'');
      const encoded = encodeURIComponent(file).replace(/%20/g,'_').replace(/'/g,'%27');
      return {title:title,artist:'',date:'',culture:'',image:'https://commons.wikimedia.org/wiki/Special:FilePath/'+encoded+'?width=400',source:'Wikimedia',url:'https://commons.wikimedia.org/wiki/File:'+encoded};
    });
  } catch(e){return [];}
}

renderCols();
